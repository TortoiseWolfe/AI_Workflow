<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-label="A task goes from me to the head chef (Claude Code on Opus), which hands it to the director line: an Opus planner writes specs, Haiku or Sonnet cooks work in separate worktrees, tests in Docker decide pass or fail, a Jev check is logged on the side, and a blind Opus reviewer tastes before merge and push. Only results return to the head chef. Muse exchanges notes with the head chef through Gmail. The OpenClaw tray shows notifications and runs short commands I approve. The tmux crew and the MoltBot co-host are planned.">
<style><![CDATA[
@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Literata:opsz,wght@7..72,600&family=JetBrains+Mono:wght@400&display=swap");
svg{
  --paper:#f3f4f1; --ink:#1d2327; --muted:#5d676d; --rule:#cfd4d2; --panel:#e8ebe8;
  --opus:#eb6834; --opus-bg:#fbe1d6;
  --cheap:#1baf7a; --cheap-bg:#d4f1e5;
  --ext:#2a78d6; --ext-bg:#dbe8f8;
  --tool:#6b6a66; --tool-bg:#eeeeec;
  --map:#fcfcfb; --ink2:#3f4549; --edge:#5b6368;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Literata",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
color:var(--edge)}
/* SVG classes (page CSS styles inline SVG; nothing inside the SVG) */
.bx{stroke-width:2.2}
.band-o{stroke:var(--opus)} .band-c{stroke:var(--cheap)} .band-e{stroke:var(--ext)} .band-t{stroke:var(--tool)}
.hb{stroke-width:7;stroke-linecap:butt;fill:none}
.sw-opus{fill:var(--opus)} .sw-cheap{fill:var(--cheap)} .sw-ext{fill:var(--ext)} .sw-tool{fill:var(--tool)}
.opus{fill:var(--opus-bg);stroke:var(--opus)} .cheap{fill:var(--cheap-bg);stroke:var(--cheap)}
.ext{fill:var(--ext-bg);stroke:var(--ext)} .tool{fill:var(--tool-bg);stroke:var(--tool)}
.band{fill:none;stroke:var(--rule);stroke-width:1.2}
.shadow{stroke-dasharray:8 5} .planned{stroke-dasharray:3 5;opacity:.9}
.e{fill:none;stroke:var(--edge);stroke-width:1.8}
.t{fill:var(--ink);font-family:var(--body);font-size:17px;font-weight:600}
.s{fill:var(--ink2);font-family:var(--mono);font-size:13px}
.l{fill:var(--ink2);font-family:var(--mono);font-size:13px}
.bt{fill:var(--ink2);font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

]]></style>
